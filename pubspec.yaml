name: habitx
description: "HabitX - Calm Attention Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  dio: ^5.8.0+1
  google_fonts: ^6.2.1
  iconsax_flutter: ^1.0.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  connectivity_plus: ^6.1.3
  animate_do: ^3.3.4
  pinput: ^5.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/lottie/
